name: Release Petal

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: bloom-directory/petal/.github/workflows/release-petal.yml@66ac2b675aac7ea4f67ccf3b45c1d346b1f0ef37
    with:
      petal-name: hyperliquid
      petal-tooling-ref: "66ac2b675aac7ea4f67ccf3b45c1d346b1f0ef37"
      build-command: scripts/build.sh
      package-root: .
      expected-route-count: 73
