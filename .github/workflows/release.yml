name: Release Petal

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: bloom-directory/petal/.github/workflows/release-petal.yml@61938d0c127cfe03c7e3e55baed0ba1439bc5ca2
    with:
      petal-name: hyperliquid
      petal-tooling-ref: "61938d0c127cfe03c7e3e55baed0ba1439bc5ca2"
      build-command: scripts/build.sh
      package-root: .
      expected-route-count: 66
