name: Release Petal

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: bloom-directory/petal/.github/workflows/release-petal.yml@465d6f2464a6a87910128f5448d1543ccb2aeb2a
    with:
      petal-name: hyperliquid
      petal-tooling-ref: "465d6f2464a6a87910128f5448d1543ccb2aeb2a"
      build-command: scripts/build.sh
      package-root: .
      expected-route-count: 73
