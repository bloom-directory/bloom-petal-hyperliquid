name: Release Petal

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: bloom-directory/petal/.github/workflows/release-petal.yml@8691f84acf98db203a75850b152d55366403f6a5
    with:
      petal-name: hyperliquid
      petal-tooling-ref: "8691f84acf98db203a75850b152d55366403f6a5"
      build-command: scripts/build.sh
      package-root: .
      expected-route-count: 70
