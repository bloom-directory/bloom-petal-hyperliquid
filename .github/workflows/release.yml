name: Release Petal

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: bloom-directory/petal/.github/workflows/release-petal.yml@25c89810ecc79481b11a8a4460dfd7b9aa8473fa
    with:
      petal-name: hyperliquid
      petal-tooling-ref: "25c89810ecc79481b11a8a4460dfd7b9aa8473fa"
      build-command: scripts/build.sh
      package-root: .
      expected-route-count: 63
