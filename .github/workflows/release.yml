name: Release Petal

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: bloom-directory/petal/.github/workflows/release-petal.yml@8501029631b4305a18084185a9bb6fb0daed2147
    with:
      petal-name: hyperliquid
      petal-tooling-ref: "8501029631b4305a18084185a9bb6fb0daed2147"
      build-command: scripts/build.sh
      package-root: .
      expected-route-count: 74
