name: Release Petal

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: bloom-directory/petal/.github/workflows/release-petal.yml@b9fc22d6d8211bc41304b38b1ef8b5269c8035bd
    with:
      petal-name: hyperliquid
      petal-tooling-ref: "b9fc22d6d8211bc41304b38b1ef8b5269c8035bd"
      build-command: scripts/build.sh
      package-root: .
      expected-route-count: 63
