name: Release Petal

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: bloom-directory/petal/.github/workflows/release-petal.yml@39bc8476ff055922f52b71a4953ed70004e9c5d3
    with:
      petal-name: hyperliquid
      petal-tooling-ref: "39bc8476ff055922f52b71a4953ed70004e9c5d3"
      build-command: scripts/build.sh
      package-root: .
      expected-route-count: 70
