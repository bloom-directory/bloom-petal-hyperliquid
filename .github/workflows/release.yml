name: Release Petal

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: bloom-directory/petal/.github/workflows/release-petal.yml@864a80b407387871bae06aabe77b91865e55f7bc
    with:
      petal-name: hyperliquid
      petal-tooling-ref: "864a80b407387871bae06aabe77b91865e55f7bc"
      build-command: scripts/build.sh
      package-root: .
      expected-route-count: 70
