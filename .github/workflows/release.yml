name: Release Petal

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: bloom-directory/petal/.github/workflows/release-petal.yml@73c5b06a77599368fbc79fb7947a629b5b4c630e
    with:
      petal-name: hyperliquid
      petal-tooling-ref: "73c5b06a77599368fbc79fb7947a629b5b4c630e"
      build-command: scripts/build.sh
      package-root: .
      expected-route-count: 70
