name: Release Petal

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: bloom-directory/petal/.github/workflows/release-petal.yml@251863114b2a5ad8a4465281c8e63fc5c47723a8
    with:
      petal-name: hyperliquid
      petal-tooling-ref: "251863114b2a5ad8a4465281c8e63fc5c47723a8"
      build-command: scripts/build.sh
      package-root: .
      expected-route-count: 63
