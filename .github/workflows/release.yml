name: Release Petal

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: bloom-directory/petal/.github/workflows/release-petal.yml@e93bfd8e937a80739bc723edae3853bf9bbdc649
    with:
      petal-name: hyperliquid
      petal-tooling-ref: "e93bfd8e937a80739bc723edae3853bf9bbdc649"
      build-command: scripts/build.sh
      package-root: .
      expected-route-count: 70
