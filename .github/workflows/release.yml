name: Release Petal

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: bloom-directory/petal/.github/workflows/release-petal.yml@eda6647c523bba161eaa22812aa0e75ec7782404
    with:
      petal-name: hyperliquid
      petal-tooling-ref: "eda6647c523bba161eaa22812aa0e75ec7782404"
      build-command: scripts/build.sh
      package-root: .
      expected-route-count: 63
