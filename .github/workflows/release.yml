name: Release Petal

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: bloom-directory/petal/.github/workflows/release-petal.yml@42bd25589ff721ce14f43f21e9eaf702bfbc42e5
    with:
      petal-name: hyperliquid
      petal-tooling-ref: "42bd25589ff721ce14f43f21e9eaf702bfbc42e5"
      build-command: scripts/build.sh
      package-root: .
      expected-route-count: 63
