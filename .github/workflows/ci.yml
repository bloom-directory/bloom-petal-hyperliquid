name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Show Rust toolchain
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            route

      - name: Check formatting
        run: cargo fmt --manifest-path route/Cargo.toml -- --check

      - name: Check route architecture
        run: scripts/check-route-architecture.sh

      - name: Run tests
        run: cargo test --manifest-path route/Cargo.toml --locked

      - name: Run clippy
        run: cargo clippy --manifest-path route/Cargo.toml --locked --all-targets -- -D warnings

      - name: Install component tools
        run: cargo install wasm-tools --version 1.249.0 --locked

      - name: Install canonical Petal toolchain
        run: cargo install --git https://github.com/bloom-directory/petal --rev 25c89810ecc79481b11a8a4460dfd7b9aa8473fa --locked bloom-petal-cli

      - name: Build source package
        run: scripts/build.sh

      - name: Check out pinned Petal tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bloom-directory/petal
          ref: 42bd25589ff721ce14f43f21e9eaf702bfbc42e5
          path: .petal-tooling
          persist-credentials: false

      - name: Validate release packaging
        shell: bash
        run: |
          set -euo pipefail
          cargo build \
            --locked \
            --release \
            --manifest-path .petal-tooling/Cargo.toml \
            -p bloom-petal-cli
          cp .petal-tooling/target/release/petal "$RUNNER_TEMP/petal"
          rm -rf .petal-tooling
          "$RUNNER_TEMP/petal" package \
            --root . \
            --out "$RUNNER_TEMP/hyperliquid-ci.petal.tar.gz" \
            | jq -e '.routes == 63'

      - name: Check out Bloom CLI
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bloom-directory/bloom
          ref: master
          path: bloom
          persist-credentials: false

      - name: Build Bloom CLI
        run: |
          cargo build --release --manifest-path bloom/Cargo.toml -p bloom --bin bloom
          cp bloom/target/release/bloom "$RUNNER_TEMP/bloom"
          rm -rf bloom

      - name: Smoke install and dispatch
        shell: bash
        run: |
          set -euo pipefail
          home="$(mktemp -d)"
          "$RUNNER_TEMP/bloom" --home "$home" petals install "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/bloom" --home "$home" vfs cat /petals/hyperliquid/README.md \
            | grep -Fq 'Hyperliquid Petal'
          "$RUNNER_TEMP/bloom" --home "$home" vfs ls /petals/hyperliquid/mainnet \
            | grep -Fq 'mids.json'
          "$RUNNER_TEMP/bloom" --home "$home" vfs cat /petals/hyperliquid/testnet/status.json \
            | jq -e '.network == "Testnet"'
          "$RUNNER_TEMP/bloom" --home "$home" vfs cat \
            /petals/hyperliquid/testnet/exchange/0x0000000000000000000000000000000000000000/usd_send.json \
            | jq -e '.body.amount | contains("6 decimal")'

      - name: Validate GitHub source install
        shell: bash
        run: |
          set -euo pipefail
          source_url="https://github.com/${GITHUB_REPOSITORY}"
          source_ref="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            source_url="$(jq -r '.pull_request.head.repo.html_url' "$GITHUB_EVENT_PATH")"
            source_ref="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
          fi
          home="$(mktemp -d)"
          "$RUNNER_TEMP/bloom" --home "$home" petals install "$source_url" --ref "$source_ref"
          "$RUNNER_TEMP/bloom" --home "$home" vfs ls /petals/hyperliquid/mainnet \
            | grep -Fq 'agent_sessions'
