name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Show Rust toolchain
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            route

      - name: Check formatting
        run: cargo fmt --manifest-path route/Cargo.toml -- --check

      - name: Check route architecture
        run: scripts/check-route-architecture.sh

      - name: Run tests
        run: cargo test --manifest-path route/Cargo.toml --locked

      - name: Run clippy
        run: cargo clippy --manifest-path route/Cargo.toml --locked --all-targets -- -D warnings

      - name: Install component tools
        run: cargo install wasm-tools --version 1.249.0 --locked

      - name: Install canonical Petal toolchain
        run: cargo install --git https://github.com/bloom-directory/petal --rev 61938d0c127cfe03c7e3e55baed0ba1439bc5ca2 --locked bloom-petal-cli

      - name: Build source package
        run: scripts/build.sh

      - name: Check out pinned Petal tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bloom-directory/petal
          ref: 61938d0c127cfe03c7e3e55baed0ba1439bc5ca2
          path: .petal-tooling
          persist-credentials: false

      - name: Validate release packaging
        shell: bash
        run: |
          set -euo pipefail
          cargo build \
            --locked \
            --release \
            --manifest-path .petal-tooling/Cargo.toml \
            -p bloom-petal-cli
          cp .petal-tooling/target/release/petal "$RUNNER_TEMP/petal"
          rm -rf .petal-tooling
          "$RUNNER_TEMP/petal" package \
            --root . \
            --out "$RUNNER_TEMP/hyperliquid-ci.petal.tar.gz" \
            | jq -e '.routes == 66'

      - name: Check out exact Bloom package contract
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bloom-directory/bloom
          ref: bbbb5a3a610b09e4a8bd61bb301bb89ae718e9fb
          path: .bloom-contract
          persist-credentials: false

      - name: Validate delegated-key and signing metadata
        env:
          BLOOM_ROOT: ${{ github.workspace }}/.bloom-contract
          PACKAGE_ARCHIVE: ${{ runner.temp }}/hyperliquid-ci.petal.tar.gz
        run: scripts/check-triad-package.sh

      # The current triad runtime is authenticated-daemon-only, so this job
      # deliberately stops at immutable package validation. End-to-end install
      # and dispatch are exercised by the linked Bloom/Harbor integration lane.
      - name: Validate triad host contracts in built routes
        shell: bash
        run: |
          set -euo pipefail
          new_route='petal/hyperliquid/[network]/agent_sessions/[wallet]/new.json.wasm'
          action_route='petal/hyperliquid/[network]/agent_sessions/[wallet]/[session]/cancel.json.wasm'
          wasm-tools component wit "$new_route" | grep -Fq 'import bloom:key/derive@0.1.0;'
          wasm-tools component wit "$new_route" | grep -Fq 'import bloom:sign/signing@0.2.0;'
          wasm-tools component wit "$action_route" | grep -Fq 'import bloom:sign/signing@0.2.0;'
