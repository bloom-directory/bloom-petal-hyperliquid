name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Show Rust toolchain
        run: rustup show

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            route
            sdk
            xtask

      - name: Check formatting
        run: |
          cargo fmt --manifest-path route/Cargo.toml -- --check
          cargo fmt --manifest-path sdk/Cargo.toml -- --check
          cargo fmt --manifest-path xtask/Cargo.toml -- --check

      - name: Run tests
        run: |
          cargo test --manifest-path route/Cargo.toml --locked
          cargo test --manifest-path sdk/Cargo.toml --locked
          cargo test --manifest-path xtask/Cargo.toml --locked

      - name: Run clippy
        run: |
          cargo clippy --manifest-path route/Cargo.toml --locked --all-targets -- -D warnings
          cargo clippy --manifest-path sdk/Cargo.toml --locked --all-targets -- -D warnings
          cargo clippy --manifest-path xtask/Cargo.toml --locked --all-targets -- -D warnings

      - name: Build source package
        run: scripts/build.sh

      - name: Check out pinned Petal tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bloom-directory/petal
          ref: b69fe526b1bd65df81276c934a9d7403e2a735bf
          path: .petal-tooling
          persist-credentials: false

      - name: Validate release packaging
        shell: bash
        run: |
          set -euo pipefail
          cargo build \
            --locked \
            --release \
            --manifest-path .petal-tooling/Cargo.toml \
            -p bloom-petal-cli
          cp .petal-tooling/target/release/petal "$RUNNER_TEMP/petal"
          rm -rf .petal-tooling
          "$RUNNER_TEMP/petal" package \
            --root . \
            --out "$RUNNER_TEMP/hyperliquid-ci.petal.tar.gz" \
            | jq -e '.routes == 62'

      - name: Check out Bloom CLI
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bloom-directory/bloom
          ref: master
          path: bloom
          persist-credentials: false

      - name: Build Bloom CLI
        run: |
          cargo build --release --manifest-path bloom/Cargo.toml -p bloom --bin bloom
          cp bloom/target/release/bloom "$RUNNER_TEMP/bloom"
          rm -rf bloom

      - name: Smoke install and dispatch
        shell: bash
        run: |
          set -euo pipefail
          home="$(mktemp -d)"
          "$RUNNER_TEMP/bloom" --home "$home" petals install "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/bloom" --home "$home" vfs cat /petals/hyperliquid/README.md \
            | grep -Fq 'Hyperliquid Petal'
          "$RUNNER_TEMP/bloom" --home "$home" vfs ls /petals/hyperliquid/mainnet \
            | grep -Fq 'mids.json'

      - name: Validate GitHub source install
        shell: bash
        run: |
          set -euo pipefail
          source_url="https://github.com/${GITHUB_REPOSITORY}"
          source_ref="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            source_url="$(jq -r '.pull_request.head.repo.html_url' "$GITHUB_EVENT_PATH")"
            source_ref="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
          fi
          home="$(mktemp -d)"
          "$RUNNER_TEMP/bloom" --home "$home" petals install "$source_url" --ref "$source_ref"
          "$RUNNER_TEMP/bloom" --home "$home" vfs ls /petals/hyperliquid/mainnet \
            | grep -Fq 'agent_sessions'
