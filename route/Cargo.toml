[package]
name = "bloom-hyperliquid-petal-route"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["rlib"]

[dependencies]
alloy-dyn-abi = { version = "1.6", features = ["eip712"] }
alloy-primitives = { version = "=1.6.1", default-features = false, features = ["std"] }
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
petal = { package = "bloom-petal-sdk", git = "https://github.com/bloom-directory/petal", rev = "b9fc22d6d8211bc41304b38b1ef8b5269c8035bd" }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
