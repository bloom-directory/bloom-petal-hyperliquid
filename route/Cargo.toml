[package]
name = "bloom-hyperliquid-petal-route"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["rlib"]

[dependencies]
alloy-dyn-abi = { version = "1.6", features = ["eip712"] }
alloy-primitives = { version = "=1.6.1", default-features = false, features = ["std", "k256"] }
hex = "0.4"
petal = { package = "bloom-petal-sdk", git = "https://github.com/bloom-directory/petal", rev = "1af3ba971e8b494b58bb85d0c0fcf2ad15cd3b4c" }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
sha2 = "0.10"
sha3 = "0.10"

[dev-dependencies]
# Produces a real recoverable signature so the owner-address binding is tested
# against actual secp256k1 output rather than a hand-rolled vector.
k256 = { version = "0.13", features = ["ecdsa"] }
